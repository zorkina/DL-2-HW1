[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minitorch-hw1"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
include = ["minitorch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["task0_1", "task0_2", "task0_3", "task0_4", "task1_1", "task1_2", "task1_3", "task1_4"]
